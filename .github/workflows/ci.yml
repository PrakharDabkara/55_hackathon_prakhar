name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      # The web app must build: the Docker image ships its output.
      - run: npm run build -w @kahanmilega/web
      - run: npm run test:unit
      - run: npm run test:integration

  # A real browser against the real stack. Not part of the unit or integration steps above.
  # Postgres comes from docker-compose because it needs PostGIS and pgvector together, which no
  # stock service-container image has; Redis and Postgres are the same ones used locally.
  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: cp .env.example .env
      - run: npm run db:up
      - run: npm run db:migrate
      # Builds the shared package and the API, then loads the catalog.
      - run: npm run seed:catalog
      - run: npx playwright install --with-deps chromium
      # Builds the web app, starts the API with ADMIN_PHONES set, starts five simulated grocery
      # shops that answer pings, and drives Chromium (see e2e/).
      - run: npm run test:e2e
      - name: Upload screenshot and report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e
          path: |
            e2e/artifacts
            playwright-report
          if-no-files-found: ignore

  deploy:
    needs: [ci, e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: production
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Migrations first, so new code never meets an old schema.
      - name: Run migrations on Neon
        env:
          DATABASE_URL: ${{ secrets.NEON_DIRECT_URL }}
        run: npx node-pg-migrate up -m apps/api/migrations
      # The catalog file is the source of truth; the upsert is safe to repeat.
      - name: Seed catalog on Neon
        env:
          DATABASE_URL: ${{ secrets.NEON_DIRECT_URL }}
        run: npm run seed:catalog
      # Embeds catalog items whose text changed (a second run costs nothing). It never blocks the
      # deploy (ADR-0021): a quota, 503 or timeout is reported in the job summary with the number
      # of items still un-embedded, and the next deploy embeds exactly those. Skipped, with a
      # warning, until the GEMINI_API_KEY secret exists.
      - name: Embed catalog on Neon
        continue-on-error: true
        timeout-minutes: 6
        env:
          DATABASE_URL: ${{ secrets.NEON_DIRECT_URL }}
          LLM_PROVIDER: gemini
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          EMBED_NON_BLOCKING: '1'
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "::warning::GEMINI_API_KEY is not set in the production environment; skipping catalog embeddings"
          elif ! npm run ai:embed-catalog; then
            # The script reports its own failures with exit code 0 (EMBED_NON_BLOCKING). This is
            # for a failure before it could: the build, or the database out of reach.
            echo "::warning::catalog embedding did not run; the deploy continues and the next deploy embeds what is missing"
            echo "### ⚠️ Catalog embeddings did not run" >> "$GITHUB_STEP_SUMMARY"
            echo "The deploy went on. Items without an embedding are picked up by the next deploy." >> "$GITHUB_STEP_SUMMARY"
          fi
      # Deploy exactly the commit that passed CI.
      - name: Trigger Render deploy
        env:
          DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: curl --fail --silent --show-error -X POST "${DEPLOY_HOOK_URL}&ref=${GITHUB_SHA}" > /dev/null
