# Render Blueprint. See docs/adr/0009-free-tier-hosting.md and docs/runbook.md.
services:
  - type: web
    name: kahanmilega-api
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./infra/api/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    # Deploys come from the CD job (deploy hook), never from a push.
    autoDeployTrigger: off
    envVars:
      - key: NODE_ENV
        value: production
      - key: LOG_LEVEL
        value: info
      # Demo login: the code is read from /dev/otp-inbox. Only 'simulated' exists (ADR-0013).
      - key: OTP_MODE
        value: simulated
      # Requests: answered from learned stock at this many shops, else pinged; 15 minute deadline.
      - key: MIN_STOCK_RESULTS
        value: '3'
      - key: REQUEST_TTL_MINUTES
        value: '15'
      # Ping fan-out: nearest shops asked per request; one ping per shop per item per window.
      - key: MAX_PINGS_PER_REQUEST
        value: '10'
      - key: PING_DEDUPE_MINUTES
        value: '30'
      # The expiry worker runs inside the API. The free instance sleeps when idle, so the database
      # deadline and lazy expiry on read are the truth; the queue only makes expiry timely (ADR-0015).
      - key: WORKERS_ENABLED
        value: 'true'
      # Phones that become admin on login (for the shop simulator). No value here on purpose: set it
      # by hand in the dashboard. Empty means no admin exists and the admin endpoints answer 404.
      - key: ADMIN_PHONES
        sync: false
      # AI query understanding (ADR-0020). Free-tier prompts may be reviewed by Google: only query
      # text and catalog item names are sent. The key is set by hand in the dashboard.
      - key: LLM_PROVIDER
        value: gemini
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.1-flash-lite
      # Tried after a timeout, 429 or 503 from GEMINI_MODEL (ADR-0024). Pick from `npm run ai:models`.
      - key: GEMINI_FALLBACK_MODEL
        value: gemini-3.5-flash-lite
      # One errand model call carries tool schemas and may take far longer than a resolve call (8 s).
      - key: ERRAND_AI_TIMEOUT_MS
        value: '30000'
      # Photos live in Postgres (ADR-0030): refuse uploads above this many MB in total.
      - key: PHOTO_STORAGE_CAP_MB
        value: '300'
      - key: GEMINI_EMBED_MODEL
        value: gemini-embedding-001
      - key: EMBED_THRESHOLD
        value: '0.7'
      - key: EMBED_MARGIN
        value: '0.04'
      # Neon pooled connection string. Set it in the Render dashboard.
      - key: DATABASE_URL
        sync: false
      # BullMQ expiry queue (Day 6), ping queue (Day 7). See ADR-0010.
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: kahanmilega-redis
          property: connectionString

  - type: keyvalue
    name: kahanmilega-redis
    plan: free
    region: singapore
    # BullMQ needs noeviction: an evicted queue key silently loses jobs.
    maxmemoryPolicy: noeviction
    # Empty list: reachable only over Render's private network, not the internet.
    ipAllowList: []
