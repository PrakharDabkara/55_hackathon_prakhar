# Render Blueprint. See docs/adr/0009-free-tier-hosting.md and docs/runbook.md.
services:
  - type: web
    name: kahanmilega-api
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./infra/api/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    # Deploys come from the CD job (deploy hook), never from a push.
    autoDeployTrigger: off
    envVars:
      - key: NODE_ENV
        value: production
      - key: LOG_LEVEL
        value: info
      # Demo login: the code is read from /dev/otp-inbox. Only 'simulated' exists (ADR-0013).
      - key: OTP_MODE
        value: simulated
      # Requests: answered from learned stock at this many shops, else pinged; 15 minute deadline.
      - key: MIN_STOCK_RESULTS
        value: '3'
      - key: REQUEST_TTL_MINUTES
        value: '15'
      # Ping fan-out: nearest shops asked per request; one ping per shop per item per window.
      - key: MAX_PINGS_PER_REQUEST
        value: '10'
      - key: PING_DEDUPE_MINUTES
        value: '30'
      # The expiry worker runs inside the API. The free instance sleeps when idle, so the database
      # deadline and lazy expiry on read are the truth; the queue only makes expiry timely (ADR-0015).
      - key: WORKERS_ENABLED
        value: 'true'
      # Neon pooled connection string. Set it in the Render dashboard.
      - key: DATABASE_URL
        sync: false
      # BullMQ expiry queue (Day 6), ping queue (Day 7). See ADR-0010.
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: kahanmilega-redis
          property: connectionString

  - type: keyvalue
    name: kahanmilega-redis
    plan: free
    region: singapore
    # BullMQ needs noeviction: an evicted queue key silently loses jobs.
    maxmemoryPolicy: noeviction
    # Empty list: reachable only over Render's private network, not the internet.
    ipAllowList: []
